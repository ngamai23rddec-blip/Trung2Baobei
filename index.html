<script>

 w.due=dayN()+(ok?INT[w.box]:0);L().n++;if(ok)L().ok++;if(mode){const c=S.sc[mode]||(S.sc[mode]={r:0,t:0});c.t++;if(ok)c.r++}save()}

 const vs=speechSynthesis.getVoices(),v=vs.find(v=>/^zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
/* ---------- Pinyin checker ---------- */
const V='aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ',RE=new RegExp(`(?:zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?[${V}]+(?:ng|n|r)?(?![${V}])`,'g');
const TM={'\u0304':1,'\u0301':2,'\u030c':3,'\u0300':4},MK=['','\u0304','\u0301','\u030c','\u0300'],TN=['thanh nhẹ (không dấu)','thanh 1','thanh 2','thanh 3','thanh 4'];

 return{ok:m.join('')===s,raw:str,list:m.map(x=>{let t=0;const b=x.normalize('NFD').replace(/[\u0300\u0301\u0304\u030c]/g,c=>{t=TM[c];return''}).normalize('NFC');return{raw:x,b,t}})}}
const PR=[['zh','z'],['ch','c'],['sh','s'],['j','q'],['j','x'],['q','x'],['zh','j'],['ch','q'],['sh','x'],['n','l']],ini=b=>(b.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])/)||[''])[0];
function conf(a,b){if(!a||!b)return'';const x=ini(a.b),y=ini(b.b);return x!=y&&PR.some(p=>p.includes(x)&&p.includes(y))?` (dễ nhầm ${x}/${y})`:''}

 for(const v of vs){const r=cmp(syl(v),I);if(r.ok)return r;first=first||r}return first}
function cmp(A,I){const key=x=>x.list.map(s=>s.b+s.t).join('|');
 const hl=I.ok?I.list.map((s,i)=>{const a=A.list[i];return`<b class="${a&&a.b==s.b&&a.t==s.t?'g':'r'}">${esc(s.raw)}</b>`}).join(' '):esc(I.raw);
 if(!I.list.length)return{ok:false,type:'pinyin',msg:'Bạn chưa nhập Pinyin.',hl};
 if(key(A)==key(I))return{ok:true,msg:'Chính xác!',hl};
 const ab=A.list.map(s=>s.b).join(''),ib=I.list.map(s=>s.b).join('');
 if(ab==ib&&A.list.length==I.list.length){const bad=[];A.list.forEach((s,i)=>{if(s.t!=I.list[i].t)bad.push(`âm tiết ${i+1} "${s.b}": cần ${TN[s.t]}, bạn nhập ${TN[I.list[i].t]}`)});

 const bad=[];for(let i=0;i<Math.max(A.list.length,I.list.length);i++){const a=A.list[i],b=I.list[i];if(!a||!b||a.b!=b.b)bad.push(`âm tiết ${i+1}: cần "${a?a.raw:'—'}", bạn nhập "${b?b.raw:'—'}"${conf(a,b)}`)}

/* ---------- Navigation ---------- */

 $('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${k==t?'on':''}" onclick="go('${k}')"><i>${IC[k]}</i>${n}</button>`).join('');

 ({home:dash,cards:cardsCfg,quiz:()=>qcfg('mix','Luyện tập'),vocab:vocab,mist:mist})[t]();scrollTo(0,0)}

 R=A.reduce((a,w)=>a+w.right,0),T=R+A.reduce((a,w)=>a+w.wrong,0),sc=m=>S.sc[m]?Math.round(S.sc[m].r*100/S.sc[m].t)+'%':'—',

 $('#m').innerHTML=`<div class=hero><h1>Cày từ vựng như cày phim bộ thì chắc giỏi tiếng Trung lâu rồi 🍿🌿</h1><p>😅 Học 5 phút thôi cũng được, hơn là ngồi đây đọc mấy câu mắng vui của tui nè 😜</p>

/* ---------- Flashcards ---------- */
const lessons=()=>[...new Set(S.words.map(w=>w.lesson))],lsOpt=()=>`<option value="">Tất cả bài</option>`+lessons().map(l=>`<option value="${esc(l)}">${LB(l)}</option>`).join('');

function cardsCfg(){const cnt=k=>S.words.filter(w=>fOk(w,k)).length;
 $('#m').innerHTML=`<h2>Thẻ ghi nhớ</h2><p class=mu>Lật thẻ, nhớ lại, và tự chấm điểm để ghi nhớ lâu hơn.</p><div class="card pick" style="max-width:860px;margin-top:22px"><h3>Chọn một bộ thẻ 🎴</h3>
 <div class=two><div><label>Loại</label><select id=kd onchange=upd()>${KD.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></div>
 <div><label>Trạng thái / Điểm</label><select id=st onchange=upd()>${FT.map(([v,n])=>`<option value="${v}">${n} (${cnt(v)})</option>`).join('')}</select></div></div>
 <label>Chủ đề</label><select id=ls onchange=upd()>${lsOpt().replace('Tất cả bài','Tất cả chủ đề')}</select>
 <div class=row style="margin-top:16px"><label><input type=checkbox id=sh checked> Xáo trộn</label><label>Số thẻ <input id=n type=number min=0 placeholder="tất cả" style="width:100px;padding:6px 12px"></label></div>
 <hr><p id=cnt style="font-size:18px"></p><button class="p wide" onclick=cardsGo()>▷ Bắt đầu</button></div>`;upd()}
function cardsGo(){let p=deck();if(!p.length)return alert('Bộ thẻ này chưa có thẻ nào.');if($('#sh').checked)p=pick(p,p.length);const n=+$('#n').value;if(n>0)p=p.slice(0,n);F={q:p.map(w=>w.id),i:0,f:0,re:{},tot:p.length};card()}
function card(){if(F.i>=F.q.length){$('#m').innerHTML=`<div class=card style="text-align:center;max-width:700px;margin:auto"><h2>Xong ${F.tot} thẻ 🎉</h2><p class=mu>Giỏi lắm, hôm nay thêm một bước nữa rồi nè.</p><div class=row style="justify-content:center"><button class=p onclick="go('cards')">Chọn bộ thẻ khác</button><button onclick="go('home')">Về trang chủ</button></div></div>`;return}
 const w=W(F.q[F.i]);F.f=0;$('#m').innerHTML=`<div style="max-width:760px;margin:auto"><div class=top><button onclick="go('cards')">← Thoát</button><span class=mu>Thẻ ${F.i+1}/${F.q.length}</span></div><div class=bar style="margin-bottom:6px"><i style="width:${F.i*100/F.q.length}%"></i></div>
 <div class=flip onclick=flip()><div class=inner id=fl><div class="side front"><div class=big>${esc(w.hanzi)}</div><span class=mu>Chạm hoặc nhấn Space để lật</span></div>
 <div class="side back"><div class=big style="font-size:46px;margin:0">${esc(w.hanzi)}</div><div class=q style="margin:4px 0">${esc(w.pinyin)}</div><div class=vi>${esc(w.vi)}</div></div></div></div>
 <div class=row style="justify-content:center"><button onclick="say(${w.id})">🔊 Nghe</button><button onclick="W(${w.id}).fav=!W(${w.id}).fav;save();this.textContent=W(${w.id}).fav?'♥ Đã yêu thích':'♡ Yêu thích'">${w.fav?'♥ Đã yêu thích':'♡ Yêu thích'}</button></div>
 <div id=ctl class=row style="justify-content:center"><button class="p wide" onclick=flip()>Lật thẻ</button></div></div>`;say(w.id)}
function flip(){if(!F||F.i>=F.q.length)return;F.f=!F.f;$('#fl').classList.toggle('f',!!F.f);if(F.f)$('#ctl').innerHTML=GR.map((g,i)=>`<button class="gb g${i}" onclick="gr(${i})"><b>${g}</b><small>${i+1}</small></button>`).join('')}
function gr(g){const id=F.q[F.i],w=W(id);w.seen++;w.last=g;L().n++;if(g==0){w.box=0;w.due=dayN();if(!F.re[id]){F.re[id]=1;F.q.push(id)}}else if(g==1){w.box=Math.max(1,w.box);w.due=dayN()+1}else{w.box=Math.min(5,w.box+(g==3?2:1));w.due=dayN()+INT[w.box];L().ok++}save();F.i++;card()}
/* ---------- Quiz engine (Pinyin / Quiz / Listening / Writing / Mistakes) ---------- */
const MN={'hv-vi':'Hanzi → nghĩa','vi-hv':'Nghĩa → Hanzi','hv-pyc':'Hanzi → chọn Pinyin','pyc-hv':'Pinyin → chọn Hanzi',py:'Hanzi → nhập Pinyin',listen:'Nghe → chọn nghĩa',write:'Viết Hanzi',mix:'Tổng hợp'};

/* ---------- Pinyin-lookalike distractors ---------- */
const bs=p=>syl(p.replace(/\([^)]*\)/g,'')).list,bKey=p=>bs(p).map(x=>x.b).join(''),tKey=p=>bs(p).map(x=>x.b+x.t).join('|');
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
function toneVars(p){const str=p.toLowerCase().normalize('NFC'),ms=[...str.matchAll(RE)],out=[];
 ms.forEach((m,mi)=>{const L=syl(m[0]).list[0];if(!L)return;for(let t=0;t<=4;t++){if(t==L.t)continue;const ns=mark(L.b,t).normalize('NFC');
  out.push(str.slice(0,m.index)+ns+str.slice(m.index+m[0].length))}});return out}
function simWords(w,n){const a=bKey(w.pinyin),ta=tKey(w.pinyin);
 return S.words.filter(x=>x.id!=w.id&&tKey(x.pinyin)!=ta&&x.hanzi!=w.hanzi).map(x=>({x,d:lev(a,bKey(x.pinyin))*2+(bs(x.pinyin).length==bs(w.pinyin).length?0:1)+Math.random()*.9})).sort((p,q)=>p.d-q.d).slice(0,n).map(o=>o.x)}
function pyOpts(w){const seen=new Set([tKey(w.pinyin)]),out=[],add=s=>{const k=tKey(s);if(k&&!seen.has(k)){seen.add(k);out.push(s);return 1}};
 pick(toneVars(w.pinyin),2).forEach(add);simWords(w,8).forEach(x=>{if(out.length<3)add(x.pinyin)});pick(toneVars(w.pinyin),6).forEach(x=>{if(out.length<3)add(x)});
 return pick([{t:w.pinyin,ok:1},...out.slice(0,3).map(t=>({t}))],4)}
function hzOpts(w){const seen=new Set([w.hanzi]),out=[];simWords(w,10).forEach(x=>{if(out.length<3&&!seen.has(x.hanzi)){seen.add(x.hanzi);out.push(x.hanzi)}});
 return pick([{t:w.hanzi,ok:1},...out.map(t=>({t}))],4)}
function qcfg(mode,title){$('#m').innerHTML=`<h2>${title}</h2><div class=card><div class=row>Dạng ${mode=='mix'?`<select id=md>${['mix','hv-vi','vi-hv','hv-pyc','pyc-hv','py','listen','write'].map(k=>`<option value=${k}>${MN[k]}</option>`).join('')}</select>`:`<b>${MN[mode]}</b><input type=hidden id=md value=${mode}>`}
 Bài <select id=ls>${lsOpt()}</select> Số câu <input id=n type=number min=1 placeholder="Tất cả" style="width:110px"></div><button class=p onclick="startQ($('#md').value,byLs($('#ls').value),+$('#n').value)">Bắt đầu</button></div>`}
function startQ(mode,pool,n){if(!pool.length)return alert('Chưa có từ phù hợp.');const ws=pick(pool,n>0?Math.min(n,pool.length):pool.length);
 Q={mode,i:0,ok:0,items:ws.map(w=>({w,m:mode=='mix'?pick(['hv-vi','vi-hv','hv-pyc','pyc-hv','py','listen','write'],1)[0]:mode})),wait:0,errs:[]};showQ()}
function showQ(){if(Q.i>=Q.items.length)return endQ();const{w,m}=Q.items[Q.i];Q.wait=0;let b='',h=`<div class=mu>Câu ${Q.i+1}/${Q.items.length} · ${MN[m]}</div>`;
 if(m=='hv-vi'||m=='vi-hv'||m=='listen'){const k=m=='vi-hv'?'hanzi':'vi',o=pick([w,...pick(S.words.filter(x=>x[k]!=w[k]),3)],4);
  h+=m=='hv-vi'?`<div class=big>${esc(w.hanzi)}</div>`:m=='vi-hv'?`<div class=q>${esc(w.vi)}</div>`:`<div class=q>🔊</div>`;
  b=`<div class=opts>${o.map(x=>`<button onclick="ans(${x.id})">${esc(x[k])}</button>`).join('')}</div>`}
 else if(m=='hv-pyc'||m=='pyc-hv'){const o=Q.items[Q.i].o=m=='hv-pyc'?pyOpts(w):hzOpts(w);
  h+=m=='hv-pyc'?`<div class=big>${esc(w.hanzi)}</div>`:`<div class=q style="font-size:40px">${esc(w.pinyin)}</div>`;
  b=`<div class=opts>${o.map((x,i)=>`<button onclick="ansO(${i})" style="${m=='pyc-hv'?'font-size:30px;font-family:\'Noto Sans SC\',sans-serif':''}">${esc(x.t)}</button>`).join('')}</div>`}
 else{h+=m=='py'?`<div class=big>${esc(w.hanzi)}</div>`:`<div class=q>${esc(w.pinyin)}<br><span class=mu>${esc(w.vi)}</span></div>`;
  b=`<div class=row><input id=inp autocomplete=off autofocus placeholder="${m=='py'?'vd: xuéxí hoặc xue2xi2':'gõ chữ Hán'}" style="flex:1"><button class=p onclick="sub()">Kiểm tra</button></div>`}
 $('#m').innerHTML=`<div class=card>${h}<div class=row><button onclick="say(${w.id})">🔊 Nghe</button></div>${b}<div id=fb></div></div>`;if(m=='listen'||m=='py'&&0)say(w.id);const i=$('#inp');if(i)i.focus()}
function fin(ok,type,extra){const{w,m}=Q.items[Q.i];rec(w,ok,type,m);if(ok)Q.ok++;else Q.errs.push(w.id);Q.wait=1;
 document.querySelectorAll('.opts button').forEach(b=>b.disabled=true);
 $('#fb').innerHTML=`<p class="${ok?'ok':'bad'}"><b>${ok?'✓ Đúng':'✗ Sai'}</b> ${extra||''}</p><p>${esc(w.hanzi)} · <b>${esc(w.pinyin)}</b> · ${esc(w.vi)}</p><button class=p onclick="Q.i++;showQ()">Tiếp (Enter)</button>`;say(w.id)}
function ans(id){if(Q.wait)return;const{w,m}=Q.items[Q.i];fin(id==w.id,m=='hv-vi'?'meaning':m=='vi-hv'?'hanzi':'listen')}
function ansO(i){if(Q.wait)return;const it=Q.items[Q.i];fin(!!it.o[i].ok,it.m=='hv-pyc'?'pinyin':'hanzi')}
function sub(){if(Q.wait)return;const{w,m}=Q.items[Q.i],v=$('#inp').value.trim();
 if(m=='py'){const r=chk(w.pinyin,v);fin(r.ok,r.type,`<br>Bạn nhập: ${r.hl}<br>${esc(r.msg)}`)}else fin(v.replace(/[()]/g,'')==w.hanzi.replace(/[()]/g,''),'hanzi',v?`Bạn viết: ${esc(v)}`:'')}
document.addEventListener('keydown',e=>{if(F&&!/^(INPUT|SELECT|BUTTON)$/.test(e.target.tagName)){if(e.key==' '||e.key=='Enter'){e.preventDefault();flip();return}if(/^[1-4]$/.test(e.key)&&F.f&&F.i<F.q.length){gr(+e.key-1);return}}if(e.key!='Enter'||!Q)return;if(Q.wait){Q.i++;showQ()}else if($('#inp'))sub()});
function endQ(){S.hist.push({d:today(),mode:MN[Q.mode],s:Q.ok,n:Q.items.length});S.hist=S.hist.slice(-50);save();
 $('#m').innerHTML=`<div class=card><h2>Kết quả: ${Q.ok}/${Q.items.length} (${Math.round(Q.ok*100/Q.items.length)}%)</h2>${Q.errs.length?`<p>Từ sai:</p>${[...new Set(Q.errs)].map(id=>`<div>${esc(W(id).hanzi)} · ${esc(W(id).pinyin)} · ${esc(W(id).vi)}</div>`).join('')}`:'<p>Hoàn hảo! 🎉</p>'}<div class=row><button class=p onclick="go('home')">Trang chủ</button><button onclick="startQ(Q.mode,Q.items.map(i=>i.w),Q.items.length)">Làm lại</button></div></div>`}
/* ---------- Mistakes ---------- */
const EN={hanzi:'Sai Hanzi',pinyin:'Sai Pinyin',tone:'Sai thanh điệu',meaning:'Nhớ sai nghĩa',listen:'Nghe không nhận ra'};
function mist(){const ms=S.words.filter(w=>w.wrong-w.right*.5>0).sort((a,b)=>(b.wrong-b.right*.5)-(a.wrong-a.right*.5)),tot={};
 ms.forEach(w=>Object.entries(w.err).forEach(([k,v])=>tot[k]=(tot[k]||0)+v));
 $('#m').innerHTML=`<h2>Ôn lỗi sai</h2><div class=card>${Object.keys(EN).map(k=>`<span class=tag>${EN[k]}: ${tot[k]||0}</span> `).join('')}<p class=mu>Từ trả lời đúng nhiều lần sẽ tụt xuống cuối danh sách; từ hay sai được ưu tiên.</p>
 <button class=p onclick="startQ('mix',S.words.filter(w=>w.wrong-w.right*.5>0).sort((a,b)=>(b.wrong-b.right*.5)-(a.wrong-a.right*.5)).slice(0,20),20)" ${ms.length?'':'disabled'}>Làm bài từ các từ sai</button></div>
 <div class=card>${ms.map(w=>`<div>${esc(w.hanzi)} · ${esc(w.pinyin)} · ${esc(w.vi)} <span class=mu>(sai ${w.wrong}, đúng ${w.right}${Object.keys(w.err).length?' · '+Object.keys(w.err).map(k=>EN[k]).join(', '):''})</span></div>`).join('')||'<span class=mu>Chưa có lỗi nào.</span>'}</div>`}
/* ---------- My vocabulary ---------- */
function vocab(){let a=S.words.map((w,i)=>({...w,n:i+1})).filter(w=>(!V0.st||stt(w)==V0.st)&&(!V0.ls||String(w.lesson)==V0.ls)&&(!V0.q||(w.hanzi+w.pinyin+w.vi).toLowerCase().includes(V0.q.toLowerCase())||syl(w.pinyin).list.map(s=>s.b).join('').includes(syl(V0.q).list.map(s=>s.b).join('')||'\0')));
 if(V0.sort)a.sort((x,y)=>syl(x.pinyin).list.map(s=>s.b).join('').localeCompare(syl(y.pinyin).list.map(s=>s.b).join('')));
 $('#m').innerHTML=`<h2>Từ vựng của tôi <span class=mu>(${a.length}/${S.words.length})</span></h2><div class=row><input id=q placeholder="Tìm Hanzi / Pinyin / Việt" value="${esc(V0.q)}" oninput="V0.q=this.value;clearTimeout(window.tq);window.tq=setTimeout(()=>{vocab();$('#q').focus()},250)">
 <select onchange="V0.st=this.value;vocab()"><option value="">Mọi trạng thái</option>${Object.entries(STN).map(([k,v])=>`<option value=${k} ${V0.st==k?'selected':''}>${v}</option>`).join('')}</select>
 <select onchange="V0.ls=this.value;vocab()">${lsOpt().replace(`value="${V0.ls}"`,`value="${V0.ls}" selected`)}</select><label><input type=checkbox ${V0.sort?'checked':''} onchange="V0.sort=this.checked;vocab()"> A→Z Pinyin</label></div>
 <div class=row><button onclick="addW()">＋ Thêm từ</button><button onclick="$('#fi').click()">📥 Nhập .docx</button><input id=fi type=file accept=.docx multiple hidden onchange="imp(this.files)"><button onclick="csv()">📤 Xuất CSV (mở bằng Excel)</button></div>
 <div class=card style="overflow-x:auto"><table><tr><th>STT<th>Hanzi<th>Pinyin<th>Nghĩa<th>Bài<th>Trạng thái<th></tr>${a.map(w=>`<tr><td>${w.n}<td style="font-size:20px">${esc(w.hanzi)}<td>${esc(w.pinyin)}<td>${esc(w.vi)}${w.orig?' <span class=tag>đã sửa</span>':''}${w.src=='manual'?' <span class=tag>thêm tay</span>':''}<td>${LB(w.lesson)}<td>${STN[stt(w)]}
 <td style="white-space:nowrap"><span style="cursor:pointer" onclick="W(${w.id}).fav=!W(${w.id}).fav;save();vocab()">${w.fav?'★':'☆'}</span> <span style="cursor:pointer" onclick="edW(${w.id})">✎</span> <span style="cursor:pointer" onclick="delW(${w.id})">🗑</span></tr>`).join('')}</table></div>`}
function edW(id){const w=W(id),h=prompt('Hanzi',w.hanzi);if(h===null)return;const p=prompt('Pinyin',w.pinyin);if(p===null)return;const v=prompt('Nghĩa tiếng Việt',w.vi);if(v===null)return;
 if(!w.orig)w.orig={hanzi:w.hanzi,pinyin:w.pinyin,vi:w.vi};Object.assign(w,{hanzi:h,pinyin:p,vi:v});save();vocab()}
function delW(id){if(confirm('Xóa từ này?')){S.words=S.words.filter(w=>w.id!=id);save();vocab()}}
const nid=()=>Math.max(0,...S.words.map(w=>w.id))+1,mk=(h,p,v,l,src)=>({id:nid(),lesson:l,hanzi:h,pinyin:p,vi:v,src,box:0,due:0,seen:0,right:0,wrong:0,fav:0,hard:0,err:{}});
function addW(){const h=prompt('Hanzi');if(!h)return;const p=prompt('Pinyin')||'',v=prompt('Nghĩa tiếng Việt')||'';S.words.push(mk(h,p,v,'Thêm tay','manual'));save();vocab()}
function csv(){const r=[['STT','Hanzi','Pinyin','Nghĩa','Bài','Trạng thái'],...S.words.map((w,i)=>[i+1,w.hanzi,w.pinyin,w.vi,LB(w.lesson),STN[stt(w)]])];
 const b=new Blob(['\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tu-vung.csv';a.click()}
async function imp(files){if(!window.mammoth)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';s.onload=ok;s.onerror=()=>no();document.head.append(s)}).catch(()=>alert('Cần internet để nạp bộ đọc .docx.'));
 if(!window.mammoth)return;let add=0,dup=0;const seen=new Set(S.words.map(w=>w.hanzi+'|'+w.pinyin));
 for(const f of files){const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()}),d=new DOMParser().parseFromString(r.value,'text/html');
  d.querySelectorAll('table').forEach((t,ti)=>{let p=t.previousElementSibling,l=null;while(p&&!l){const m=p.textContent.match(/B[ÀA]I\s*(\d+)/i);if(m)l=+m[1];p=p.previousElementSibling}
   t.querySelectorAll('tr').forEach(tr=>{const c=[...tr.cells].map(x=>x.textContent.trim());if(c.length>=4&&/^\d+$/.test(c[0])&&c[1]){const k=c[1]+'|'+c[2];if(seen.has(k))dup++;else{seen.add(k);S.words.push(mk(c[1],c[2],c[3],l||f.name+' #'+(ti+1),f.name));add++}}})})}
 save();alert(`Đã thêm ${add} từ mới, bỏ qua ${dup} từ trùng.`);vocab()}
go('home');
</script></body></html>
